# Unified MCP gateway config.
#
# This committed file is intentionally generic. Keep machine-specific paths,
# credentials, device identities, and private upstreams out of Git.

[server]
name = "agent-mcp-gateway"
title = "MCP Gateway"
description = "Remote MCP gateway for filesystem, shell, device routing, optional skills, and external MCP upstreams."
instructions = "Use filesystem tools for file content, shell/process tools for terminal workflows, list_devices for remote machines, and get_skill only when a reusable skill clearly matches the task."

[surface]
mode = "agent"

[auth]
need_invite = true

[trusted_roots]
# The launcher substitutes ${repoRoot}. Additional machine-specific roots are
# added through the runtime overlay and must not be committed here.
roots = [
  { path = "${repoRoot}", project_id = "workspace", display_name = "Workspace" }
]

[openai_tunnel]
enabled = false
command = "tunnel-client"
profile = "default"

[external_mcp]
enabled = true
fail_gateway_on_startup_error = false
catalog_cache = "startup"
exposure_mode = "hybrid"
eager_schema_budget_bytes = 24576
eager_allowlist = []
startup_timeout_sec = 30.0
shutdown_timeout_sec = 5.0
default_enabled = false

[mcp_servers.context7]
enabled = false
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30.0

[mcp_servers.exa]
enabled = false
url = "https://mcp.exa.ai/mcp"
startup_timeout_sec = 30.0

[mcp_servers.deepwiki]
enabled = false
url = "https://mcp.deepwiki.com/mcp"
startup_timeout_sec = 30.0

[mcp_servers.eslint]
enabled = false
preset = "eslint"
startup_timeout_sec = 30.0

# Codegraph and ripgrep remain CLI workflows invoked through shell_execute/get_skill.
