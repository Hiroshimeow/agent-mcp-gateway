# Unified MCP gateway config.
#
# This committed file is intentionally generic. Keep machine-specific paths,
# credentials, device identities, and private upstreams out of Git.

[server]
name = "agent-mcp-gateway"
title = "MCP Gateway"
description = "Remote MCP gateway for filesystem, shell, device routing, optional skills, and external MCP upstreams."
instructions = "Use filesystem tools for file content, shell/process tools for terminal workflows, and list_devices for remote machines. Native Skills clients use the MCP Skills extension; other clients may use skill_catalog and load_skill."

[surface]
mode = "agent"

[auth]
need_invite = true

[trusted_roots]
# The launcher substitutes ${repoRoot}. This generic root grants local path
# discovery only; it is not a routable project. Machine-specific project routes
# must declare path + project_id + device_id in a private/runtime overlay.
roots = ["${repoRoot}"]

[openai_tunnel]
enabled = false
command = "tunnel-client"
profile = "default"

[external_mcp]
enabled = true
fail_gateway_on_startup_error = false
catalog_cache = "startup"
exposure_mode = "hybrid"
eager_schema_budget_bytes = 24576
eager_allowlist = []
startup_timeout_sec = 30.0
shutdown_timeout_sec = 5.0
default_enabled = false

[mcp_servers.context7]
enabled = false
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30.0

[mcp_servers.exa]
enabled = false
url = "https://mcp.exa.ai/mcp"
startup_timeout_sec = 30.0

[mcp_servers.deepwiki]
enabled = false
url = "https://mcp.deepwiki.com/mcp"
startup_timeout_sec = 30.0

[mcp_servers.eslint]
enabled = false
preset = "eslint"
startup_timeout_sec = 30.0

# Codegraph and ripgrep remain CLI workflows invoked through shell_execute.
