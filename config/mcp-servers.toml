# Unified MCP gateway config.
#
# This is the single committed config file for trusted roots and optional public
# external MCP upstreams. It intentionally contains no API keys, bearer tokens,
# or other secrets.
#
# TOML comments use '#'. The public external MCP examples below are commented out
# by default to avoid importing too many tools in a fresh clone. Uncomment only
# the upstreams you want to use.

[trusted_roots]
# Trusted roots are shared by local custom_* tools and file-oriented external MCP presets.
# Each entry may be a string path or an object with path/project_id/display_name.
# Supported path examples:
#   "${repoRoot}"
#   "C:\\temp"   # Windows path; backslashes must be escaped inside TOML strings.
#   "C:/temp"    # Also accepted on Windows.
roots = [
  { path = "${repoRoot}", project_id = "agent-mcp-gateway", display_name = "agent-mcp-gateway" },

  { path = "E:/python_project/multi-run-apps", project_id = "multi-run-apps", display_name = "multi-run-apps" },
  { path = "E:/python_project/Screens-Trans-Chatbot", project_id = "screens-trans-chatbot", display_name = "Screens-Trans-Chatbot" },
  { path = "E:/python_project/free-tunnel", project_id = "hport", display_name = "hport" },
  { path = "E:/python_project/local-live-caption-engine", project_id = "local-live-caption-engine", display_name = "local-live-caption-engine" },
  { path = "E:/git-project/OpenClaw-bot-review", project_id = "openclaw-bot-review", display_name = "OpenClaw Bot Review" },
  { path = "E:/git-project/paperclip", project_id = "paperclip", display_name = "Paperclip" },
  { path = "E:/git-project", project_id = "git-project-workspace", display_name = "Git Project Workspace Can access all repo" },
  { path = "E:/FPT", project_id = "fpt", display_name = "FPT" },
  { path = "E:/python_project/tampermonkey_auto", project_id = "tampermonkey_auto", display_name = "tampermonkey_auto" },
  { path = "C:/Users/admin/personal-mcp-launcher", project_id = "personal-mcp-launcher", display_name = "Personal MCP Launcher" }
]




[openai_tunnel]
# Optional companion daemon for ChatGPT Apps. This repo never stores tunnel credentials.
# tunnel-client reads its own profile/key outside this gateway.
enabled = false
command = "C:/Users/admin/personal-mcp-launcher/tools/tunnel-client-dist/tunnel-client.exe"
profile = "local-gpt"

[external_mcp]
enabled = true
fail_gateway_on_startup_error = false
catalog_cache = "startup"
startup_timeout_sec = 30.0
shutdown_timeout_sec = 5.0
default_enabled = true

# Public HTTP MCP servers. transport = "http" is inferred from url.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30.0

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"
startup_timeout_sec = 30.0

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
startup_timeout_sec = 30.0

# [mcp_servers.norikae]
# runner = "npx"
# args = ["-y", "norikae-mcp@0.1.4"]
# startup_timeout_sec = 30.0

# File/project oriented stdio MCP servers.

# roots = "trusted" reuses [trusted_roots].roots above.

[mcp_servers.filesystem]
preset = "filesystem"
roots = "trusted"
startup_timeout_sec = 30.0

[mcp_servers.eslint]
preset = "eslint"
startup_timeout_sec = 30.0

# GitNexus latest currently fails startup in this environment, so this config pins
# a tested release candidate that exposes its MCP catalog correctly.
# [mcp_servers.gitnexus]
# runner = "npx"
# args = ["-y", "gitnexus@1.6.6-rc.49", "mcp"]
# startup_timeout_sec = 30.0

# Codegraph is enabled when the codegraph CLI is installed on the machine.
# With fail_gateway_on_startup_error = false, an unavailable optional upstream
# is reported in external MCP diagnostics but does not block the gateway.
[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
cwd = "${repoRoot}"
startup_timeout_sec = 30.0


