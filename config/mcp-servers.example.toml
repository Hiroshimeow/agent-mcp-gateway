# Unified MCP gateway config example.
# Keep secrets out of TOML; use *_env fields for environment-variable names.

[server]
name = "personal-mcp-launcher"
title = "Local Coding Gateway"
description = "Local coding workspace for filesystem, shell, image inspection, and optional skills."
instructions = "Use filesystem tools for content, shell_execute for terminal workflows, image_preview for images, and get_skill for reusable guidance."

[trusted_roots]
# This array is the sole path-authorization source for filesystem, shell, images,
# resources, and project discovery. Legacy MCP_TRUSTED_ROOTS and
# MCP_IMAGE_PREVIEW_ROOTS values must be migrated here.
# Absolute paths used explicitly by tool calls are appended here automatically.
# Forward-slash Windows paths avoid TOML escaping.
roots = [
  { path = "${repoRoot}", project_id = "personal-mcp-launcher", display_name = "Personal MCP Launcher" }
]

[openai_tunnel]
enabled = false
command = "tunnel-client"
profile = "local-gpt"

[external_mcp]
enabled = true
fail_gateway_on_startup_error = false
catalog_cache = "startup"
startup_timeout_sec = 30.0
shutdown_timeout_sec = 5.0
default_enabled = false

[mcp_servers.context7]
enabled = false
url = "https://mcp.context7.com/mcp"

[mcp_servers.exa]
enabled = false
url = "https://mcp.exa.ai/mcp"

[mcp_servers.deepwiki]
enabled = false
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.eslint]
enabled = false
preset = "eslint"

# Add other optional servers with enabled = false, then switch to true at runtime.
# Runtime changes are staged and committed transactionally; a failed candidate
# leaves the previous client/catalog/routes active.
# Codegraph and ripgrep are intentionally used as CLI tools through shell_execute.
