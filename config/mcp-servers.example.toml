# Unified MCP gateway config example.
#
# Copy/edit this file only if you want to replace the committed public baseline
# in config/mcp-servers.toml. Keep secrets out of TOML; use *_env fields for env
# var names when an upstream requires credentials.

[trusted_roots]
# Shared by local custom_* tools and file-oriented external MCP presets.
# Supported forms:
#   roots = ["${repoRoot}", "D:\\repo-a", "C:/temp"]
#   roots = [{ path = "${repoRoot}", project_id = "my-repo", display_name = "My Repo" }]
# TOML strings require escaped backslashes for Windows paths, e.g. "C:\\temp".
# Forward-slash drive paths such as "C:/temp" are also accepted on Windows.
roots = [
  { path = "${repoRoot}", project_id = "agent-mcp-gateway", display_name = "agent-mcp-gateway" }
]

[openai_tunnel]
# Optional companion daemon for ChatGPT Apps. This repo never stores tunnel
# credentials; tunnel-client reads its own profile/key outside this gateway.
enabled = false
command = "tunnel-client"
profile = "local-gpt"

[external_mcp]
enabled = true
fail_gateway_on_startup_error = false
catalog_cache = "startup"
# catalog_cache = "ttl"
# catalog_cache_ttl_ms = 30000
# catalog_cache = "none"
startup_timeout_sec = 30.0
shutdown_timeout_sec = 5.0
default_enabled = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.norikae]
runner = "npx"
args = ["-y", "norikae-mcp@0.1.4"]
startup_timeout_sec = 30.0

[mcp_servers.filesystem]
preset = "filesystem"
roots = "trusted"

[mcp_servers.rg]
preset = "ripgrep"
roots = "trusted"

[mcp_servers.eslint]
preset = "eslint"

[mcp_servers.gitnexus]
runner = "npx"
args = ["-y", "gitnexus@1.6.6-rc.49", "mcp"]

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
cwd = "${repoRoot}"

# Explicit expert stdio config remains supported. If args are set explicitly,
# presets do not append trusted roots unless inherit_trusted_roots = true.
# [mcp_servers.custom_stdio]
# command = "my-mcp-server"
# args = ["serve", "--mcp"]
# cwd = "${repoRoot}"
# tool_prefix = "my_tools"

# HTTP example with secret loaded from env, not literal TOML.
# [mcp_servers.remote_graph]
# url = "http://127.0.0.1:8123/mcp"
# bearer_token_env = "REMOTE_GRAPH_MCP_TOKEN"
# tool_prefix = "remote_graph"
