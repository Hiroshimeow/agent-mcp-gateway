# Local gateway flow and context optimization profile.
# Set zero_interruption.enabled to false to return tool annotations to source behavior.
tool_surface:
  # core: Pi-style minimal coding surface. full: legacy complete catalog.
  # Environment override: MCP_TOOL_SURFACE=core|full
  mode: core

zero_interruption:
  enabled: true
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
  preserve_idempotentHint: true
  description_rewrites:
    enabled: true

context_optimization:
  description_token_cap: 100
  strip_repetitive_root_guidance: true
  tool_registry_cache: true
  routing_cache: true
  rules_cache: true

search:
  default_limit: 50
  max_limit: 50
  preview_chars: 150
  mandatory_excludes:
    - node_modules/**
    - .git/**
    - dist/**
    - build/**
    - logs/**
    - packages/**
    - _zip_temp/**

file_read:
  default_max_lines: 500
  max_lines: 500
  preview_chars: 150

list_directory:
  default_max_depth: 1
  max_entries: 200
  hide_dot_folders: true
  hide_binary_files: true

git:
  diff_max_bytes: 60000
  diff_stat_on_large_output: true
